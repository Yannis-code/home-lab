http:
  serversTransports:
    cockpit-insecure:
      insecureSkipVerify: true

  middlewares:
    admin-allowlist:
      ipAllowList:
        ipStrategy:
          depth: 1
        sourceRange:
          - 192.168.1.0/24
          - 192.168.150.0/24
          - 82.67.173.37/32
          - 2a01:e0a:11da:7230:ea60:e0ed:e9d8:a29f/128
          - 2a01:e0a:11da:7230:d870:af79:d95a:5c70/128

    security-headers:
      headers:
        contentTypeNosniff: true
        forceSTSHeader: true
        referrerPolicy: strict-origin-when-cross-origin
        stsIncludeSubdomains: true
        stsSeconds: 31536000
        customResponseHeaders:
          Permissions-Policy: 'camera=(), geolocation=(), microphone=()'
          Server: ''
          X-Powered-By: ''

    rate-limit:
      rateLimit:
        average: 100
        burst: 200
        period: 1s

    waf:
      plugin:
        coraza:
          directives:
            - SecRuleEngine On
            - 'SecDefaultAction "phase:1,log,deny,status:403"'
            - 'SecDefaultAction "phase:2,log,deny,status:403"'
            - 'SecRule REQUEST_URI "@rx (?i)(?:/\\.env|/\\.git|/wp-admin|/etc/passwd)" "id:1001,phase:1,log,deny,status:403"'
            - 'SecRule ARGS "@detectSQLi" "id:1002,phase:2,log,deny,status:403"'
            - 'SecRule ARGS "@detectXSS" "id:1003,phase:2,log,deny,status:403"'
