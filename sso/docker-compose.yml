services:
  keycloak-db:
    image: postgres@sha256:3c5c8892d184f738f4fe282d14ddaa613a38f00f4189d2d94725ebe6f2909ddb
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD_FILE: /run/secrets/keycloak_db_password
    secrets:
      - keycloak_db_password
    volumes:
      - keycloak_db:/var/lib/postgresql/data
    networks:
      - sso

  keycloak:
    image: quay.io/keycloak/keycloak@sha256:357829ec7c4693397533035092ad13b0644bcc95ded311f33a3738c4d9e9bdba
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/usr/local/bin/keycloak-entrypoint"]
    command: ["start", "--import-realm"]
    depends_on:
      - keycloak-db
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /realms/home-lab/.well-known/openid-configuration HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN_USERNAME:?KEYCLOAK_ADMIN_USERNAME is required}"
      KC_HOSTNAME: "${KEYCLOAK_HOST:-sso.doudou.house}"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./realm:/opt/keycloak/data/import:ro
      - ./keycloak-entrypoint:/usr/local/bin/keycloak-entrypoint:ro
    secrets:
      - keycloak_db_password
      - keycloak_admin_password
    networks:
      - proxy
      - sso
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.keycloak.rule=Host(`${KEYCLOAK_HOST:-sso.doudou.house}`)"
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.routers.keycloak.tls.certresolver=leresolver"
      - "traefik.http.routers.keycloak.middlewares=waf@file"
      - "doudou.portal.exclude=true"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy@sha256:786bed0f000c0f8a7b31619244ebab02406a8856a4faf3f5fb1df61fbd6c30ed
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: "https://${KEYCLOAK_HOST:-sso.doudou.house}/realms/home-lab"
      OAUTH2_PROXY_CLIENT_ID: home-lab-sso
      OAUTH2_PROXY_CLIENT_SECRET_FILE: /run/secrets/oauth2_proxy_client_secret
      OAUTH2_PROXY_REDIRECT_URL: "https://${OAUTH2_PROXY_HOST:-auth.doudou.house}/oauth2/callback"
      OAUTH2_PROXY_COOKIE_SECRET_FILE: /run/secrets/oauth2_proxy_cookie_secret
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_DOMAINS: ".doudou.house"
      OAUTH2_PROXY_WHITELIST_DOMAINS: ".doudou.house"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_UPSTREAMS: static://202
    secrets:
      - oauth2_proxy_client_secret
      - oauth2_proxy_cookie_secret
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.oauth2-proxy.rule=Host(`${OAUTH2_PROXY_HOST:-auth.doudou.house}`)"
      - "traefik.http.routers.oauth2-proxy.entrypoints=websecure"
      - "traefik.http.routers.oauth2-proxy.tls.certresolver=leresolver"
      - "traefik.http.routers.oauth2-proxy.middlewares=waf@file"
      - "doudou.portal.exclude=true"
      - "traefik.http.services.oauth2-proxy.loadbalancer.server.port=4180"
      - "traefik.http.middlewares.sso-forwardauth.forwardauth.address=http://sso-auth-redirect:8080/auth"
      - "traefik.http.middlewares.sso-forwardauth.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.sso-forwardauth.forwardauth.authResponseHeaders=X-Auth-Request-User,X-Auth-Request-Email,X-Auth-Request-Access-Token"
      - "traefik.http.middlewares.sso-chain.chain.middlewares=sso-forwardauth"

  sso-auth-redirect:
    image: python@sha256:1a63a53928ce53d2b0baf08092a703f4840ac5dfbd61fd48802dbf48e08c801e
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_HOST: "${OAUTH2_PROXY_HOST:-auth.doudou.house}"
    volumes:
      - ./auth-redirect.py:/app/auth-redirect.py:ro
    command: ["python", "/app/auth-redirect.py"]
    networks:
      - proxy
    labels:
      - "traefik.enable=false"
      - "doudou.portal.exclude=true"

networks:
  proxy:
    external: true
  sso:

volumes:
  keycloak_db: