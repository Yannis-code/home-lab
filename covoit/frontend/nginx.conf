server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Chemins d'API FastAPI: mêmes préfixes que le proxy de dev dans vite.config.ts.
    location ~ ^/(auth|users|admin|groups|vehicles|trips|recurring-models|reimbursements|health) {
        proxy_pass http://covoit-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA en mode hash-routing: seuls "/" et les fichiers statiques réels sont
    # servis par nginx, tout le reste relève de l'API ci-dessus.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
