[project]
name = "potager-ble"
version = "0.1.0"
description = "BLE controller for Pret a Pousser Modulo devices"
requires-python = ">=3.11"
dependencies = [
  "bleak>=0.22,<1.0",
  "paho-mqtt>=2.1,<3.0",
]

[project.scripts]
potager-ble = "src.potager_ble:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.uv]
package = false
