type: custom:custom-features-card
features:
  - type: custom:service-call
    entries:
      - type: selector
        entity_id: input_select.potager_state_target
        value_attribute: state
        options:
          - option: auto
            icon: mdi:leaf
            label: Auto
            entity_id: input_select.potager_state_target
            type: button
            value_attribute: state
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.potager_auto_set
            hold_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.potager_auto_save
          - option: manuel
            icon: mdi:tune-variant
            label: Manuel
            entity_id: input_select.potager_state_target
            type: button
            value_attribute: state
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.potager_state_target
              data:
                option: manuel
          - option: preset
            icon: mdi:playlist-star
            label: Preset
            entity_id: input_select.potager_state_target
            type: button
            value_attribute: state
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.potager_state_target
              data:
                option: preset
    #   - type: button
    #     icon: mdi:message-alert-outline
